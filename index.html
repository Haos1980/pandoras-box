<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Puszka Pandory — zaszyfrowany sejf haseł (PWA)" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Puszka Pandory · Pandora's Box</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- LOCK SCREEN -->
    <section id="lock-screen" class="screen active" aria-label="Ekran blokady">
      <div class="lock-card">
        <div class="lock-logo" aria-hidden="true">📦</div>
        <h1>Puszka Pandory</h1>
        <p class="subtitle" id="lock-subtitle">Ustaw hasło główne, aby utworzyć sejf</p>
        <form id="lock-form" autocomplete="off">
          <label class="field">
            <span>Hasło główne / Passphrase</span>
            <div class="pw-row">
              <input type="password" id="passphrase" required minlength="4" autocomplete="current-password" placeholder="••••••••" />
              <button type="button" class="icon-btn" data-toggle-pw="#passphrase" aria-label="Pokaż/ukryj">👁</button>
            </div>
          </label>
          <label class="field" id="passphrase-confirm-wrap" hidden>
            <span>Potwierdź hasło</span>
            <div class="pw-row">
              <input type="password" id="passphrase-confirm" minlength="4" autocomplete="new-password" placeholder="••••••••" />
              <button type="button" class="icon-btn" data-toggle-pw="#passphrase-confirm" aria-label="Pokaż/ukryj">👁</button>
            </div>
          </label>
          <p class="hint" id="lock-hint">Min. 4 znaki. Dane szyfrowane AES-GCM w przeglądarce.</p>
          <p class="error" id="lock-error" hidden></p>
          <button type="submit" class="btn primary" id="lock-submit">Utwórz sejf</button>
        </form>
      </div>
    </section>

    <!-- MAIN VAULT -->
    <section id="vault-screen" class="screen" aria-label="Sejf">
      <header class="topbar">
        <div class="brand">
          <span class="logo" aria-hidden="true">📦</span>
          <div>
            <h1>Puszka Pandory</h1>
            <p class="subtitle">Pandora's Box · sejf lokalny</p>
          </div>
        </div>
        <div class="top-actions">
          <button type="button" class="icon-btn" id="btn-export" title="Eksport" aria-label="Eksport">⬇</button>
          <button type="button" class="icon-btn" id="btn-import" title="Import" aria-label="Import">⬆</button>
          <button type="button" class="icon-btn" id="btn-lock" title="Zablokuj" aria-label="Zablokuj">🔒</button>
        </div>
      </header>

      <div class="toolbar">
        <label class="search-wrap">
          <span class="sr-only">Szukaj</span>
          <input type="search" id="search" placeholder="Szukaj usługi, tagu, e-maila…" autocomplete="off" />
        </label>
        <button type="button" class="btn primary fab-inline" id="btn-add" aria-label="Dodaj wpis">＋</button>
      </div>

      <main id="entry-list" class="entry-list" role="list"></main>
      <p class="empty" id="empty-state" hidden>Brak wpisów. Dodaj pierwszy (＋).</p>
    </section>

    <!-- ENTRY FORM MODAL -->
    <div id="modal" class="modal" hidden>
      <div class="modal-backdrop" data-close-modal></div>
      <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <header class="modal-head">
          <h2 id="modal-title">Nowy wpis</h2>
          <button type="button" class="icon-btn" data-close-modal aria-label="Zamknij">✕</button>
        </header>
        <form id="entry-form" autocomplete="off">
          <input type="hidden" id="entry-id" />
          <label class="field">
            <span>Nazwa usługi *</span>
            <input type="text" id="f-service" required maxlength="120" placeholder="np. Gmail, Allegro" />
          </label>
          <label class="field">
            <span>E-mail logowania</span>
            <input type="email" id="f-email" maxlength="200" placeholder="login@example.com" />
          </label>
          <label class="field">
            <span>Telefon logowania</span>
            <input type="tel" id="f-phone" maxlength="40" placeholder="+48 …" />
          </label>
          <label class="field">
            <span>Hasło</span>
            <div class="pw-row">
              <input type="password" id="f-password" maxlength="256" placeholder="opcjonalne" autocomplete="off" />
              <button type="button" class="icon-btn" data-toggle-pw="#f-password" aria-label="Pokaż/ukryj">👁</button>
            </div>
          </label>
          <label class="field">
            <span>URL</span>
            <input type="url" id="f-url" maxlength="500" placeholder="https://" />
          </label>
          <label class="field">
            <span>Tag projektu</span>
            <input type="text" id="f-tag" maxlength="60" placeholder="np. praca, prywatne" />
          </label>
          <label class="field check">
            <input type="checkbox" id="f-google" />
            <span>Login with Google</span>
          </label>
          <label class="field">
            <span>Notatki</span>
            <textarea id="f-notes" rows="3" maxlength="2000" placeholder="Dodatkowe info…"></textarea>
          </label>
          <div class="modal-actions">
            <button type="button" class="btn danger ghost" id="btn-delete" hidden>Usuń</button>
            <button type="button" class="btn ghost" data-close-modal>Anuluj</button>
            <button type="submit" class="btn primary">Zapisz</button>
          </div>
        </form>
      </div>
    </div>

    <input type="file" id="import-file" accept="application/json,.json" hidden />
    <div id="toast" class="toast" hidden role="status"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
